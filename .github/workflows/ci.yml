---
name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Run Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev

      - name: Set Up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go fix Modernizers Are Applied
        run: |
          go fix ./...
          git diff --exit-code

      - name: go fmt Passes
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet Passes
        run: go vet ./...

      - name: go build Passes
        run: go build ./...

      - name: go mod tidy Is Clean
        run: |
          go mod tidy
          git diff --exit-code

      - name: golangci-lint Passes
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: --timeout=5m

      - name: go test Passes
        run: go test ./...

  build:
    name: Build dspictl for ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: checks

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            binary: dspictl-linux-amd64
          - goos: linux
            goarch: arm
            goarm: "7"
            binary: dspictl-linux-armv7
          - goos: linux
            goarch: arm64
            binary: dspictl-linux-arm64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev

      - name: Set Up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build dspictl Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go build -o ${{ matrix.binary }} ./cmd/dspictl

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}
