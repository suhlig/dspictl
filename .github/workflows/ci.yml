---
name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Run Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go fix Modernizers Are Applied
        run: |
          go fix ./...
          git diff --exit-code

      - name: go fmt Passes
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet Passes
        run: go vet ./...

      - name: go build Passes
        run: go build ./...

      - name: go mod tidy Is Clean
        run: |
          go mod tidy
          git diff --exit-code

      - name: golangci-lint Passes
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: --timeout=5m

      - name: go test Passes
        run: go test ./...

  build:
    name: Build dspictl for Linux
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build dspictl Binary
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build -o dspictl ./cmd/dspictl

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: dspictl-linux-amd64
          path: dspictl
