name: Render wiregen diagrams
on:
  pull_request:
    paths: &filter-paths
      - contrib/**/*.yaml
      - contrib/wiregen/*.yaml
  push:
    paths: *filter-paths
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Render all example YAMLs to SVG
        run: uv run --with git+https://github.com/WeebLabs/wiregen python contrib/wiregen/render.py
      - name: Commit and push rendered SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contrib/**/*.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "ci: render example diagrams [skip ci]"
          git push
