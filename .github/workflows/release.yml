---
name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  build:
    name: Build dspictl for ${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            binary: dspictl-linux-amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            binary: dspictl-linux-arm64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm
            goarm: "7"
            binary: dspictl-linux-armv7
            cc: arm-linux-gnueabihf-gcc
            cross_arch: armhf
            pkg_config_path: /usr/lib/arm-linux-gnueabihf/pkgconfig

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          if [ -n "${{ matrix.cross_arch }}" ]; then
            sudo dpkg --add-architecture ${{ matrix.cross_arch }}
            sudo apt-get update
            sudo apt-get install -y pkg-config libusb-1.0-0-dev:${{ matrix.cross_arch }} gcc-arm-linux-gnueabihf
          else
            sudo apt-get install -y libusb-1.0-0-dev
          fi

      - name: Set Up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build dspictl Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CC: ${{ matrix.cc }}
          CGO_ENABLED: "1"
          PKG_CONFIG_PATH: ${{ matrix.pkg_config_path }}
        run: go build -o ${{ matrix.binary }} ./cmd/dspictl

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download All Binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
