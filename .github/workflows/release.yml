---
name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  build:
    name: Build dspictl for ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            binary: dspictl-linux-amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            binary: dspictl-linux-arm64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm
            goarm: "7"
            binary: dspictl-linux-armv7
            cc: arm-linux-gnueabihf-gcc
            cross_arch: armhf
            pkg_config_path: /usr/lib/arm-linux-gnueabihf/pkgconfig
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            binary: dspictl-darwin-amd64
            pkg_config_path: /usr/local/lib/pkgconfig
            cgo_ldflags: "-L/usr/local/lib"
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            binary: dspictl-darwin-arm64
            pkg_config_path: /opt/homebrew/lib/pkgconfig
            cgo_ldflags: "-L/opt/homebrew/lib"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          if [ "${{ runner.os }}" == "macOS" ]; then
            brew install libusb pkg-config
          else
            sudo apt-get update
            if [ -n "${{ matrix.cross_arch }}" ]; then
              sudo dpkg --add-architecture ${{ matrix.cross_arch }}
              sudo apt-get update
              sudo apt-get install -y pkg-config libusb-1.0-0-dev:${{ matrix.cross_arch }} gcc-arm-linux-gnueabihf
            else
              sudo apt-get install -y libusb-1.0-0-dev
            fi
          fi

      - name: Set Up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build dspictl Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CC: ${{ matrix.cc }}
          CGO_ENABLED: "1"
          PKG_CONFIG_PATH: ${{ matrix.pkg_config_path }}
          CGO_LDFLAGS: ${{ matrix.cgo_ldflags }}
        run: go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o ${{ matrix.binary }} ./cmd/dspictl

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}

  release:
    name: Create Release and Homebrew Formula
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Archives
        id: archives
        run: |
          mkdir -p archives
          for binary in artifacts/dspictl-*; do
            filename=$(basename "$binary")
            platform="${filename#dspictl-}"
            tmpdir=$(mktemp -d)
            cp "$binary" "$tmpdir/dspictl"
            chmod +x "$tmpdir/dspictl"
            tar czf "archives/dspictl-${platform}.tar.gz" -C "$tmpdir" dspictl
            rm -rf "$tmpdir"
          done
          cd archives && sha256sum * > checksums.txt
          echo "darwin_arm64_sha256=$(sha256sum "dspictl-darwin-arm64.tar.gz" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Extract Release Notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            $0 ~ "^## \\[" {flag=0; next}
            flag
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "Error: No release notes found in CHANGELOG.md for version $VERSION" >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: archives/*
          body_path: release_notes.md

      - name: Bump Homebrew Formula
        uses: mislav/bump-homebrew-formula-action@v4.1
        with:
          formula-name: dspictl
          homebrew-tap: suhlig/homebrew-tap
          download-url: https://github.com/suhlig/dspictl/releases/download/${{ github.ref_name }}/dspictl-darwin-arm64.tar.gz
          download-sha256: ${{ steps.archives.outputs.darwin_arm64_sha256 }}
        env:
          COMMITTER_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
