# asound.conf - multi-channel output configuration
pcm.multi-out {
    type route
    slave.pcm {
        type multi

        slaves {
            a {
                pcm "hw:2,0"
                channels 2
            }
            b {
                pcm "hw:3,0"
                channels 2
            }
        }

        bindings {
            0 { slave a; channel 0 }
            1 { slave a; channel 1 }
            2 { slave b; channel 0 }
            3 { slave b; channel 1 }
        }
    }

    ttable {
        0 { 0 1; 2 1 }
        1 { 1 1; 3 1 }
    }
}

pcm.!default {
    type plug
    slave.pcm "multi-out"
}

ctl.!default {
    type hw
    card 0
}
